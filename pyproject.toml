[project]
name = "pubsub-sdk-python"
version = "0.1.0"
description = "A robust Python SDK for STACKIT PubSub Data Plane API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyjwt>=2.0",
    "stackit-authorization>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src/pubsub_sdk_python --cov-branch --cov-report=term-missing --cov-fail-under=85 --ignore=tests/integration"
markers = ["integration: marks tests as integration tests (deselect with '-m \"not integration\"')"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pubsub_sdk_python"]
