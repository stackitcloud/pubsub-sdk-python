components:
  parameters:
    projectId:
      name: projectId
      description: The STACKIT portal project UUID the resource is located in.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
      in: path
      required: true
    regionId:
      name: regionId
      description: The STACKIT region name the resource is located in.
      schema:
        type: string
        enum:
          - eu01
      in: path
      required: true
    topicId:
      name: topicId
      description: The topic UUID.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
      in: path
      required: true
    subscriptionId:
      name: subscriptionId
      description: The subscription UUID.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
      in: path
      required: true
    pageToken:
      name: pageToken
      in: query
      description: A token to retrieve the next page of results.
      required: false
      allowEmptyValue: true
      schema:
        type: string
        maxLength: 1024
    pageSize:
      name: pageSize
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
        format: int32
        default: 10
        minimum: 1
        maximum: 100
    force:
      name: force
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: |
        If true, deletes the topic and all its active subscriptions (cascading delete). 
        If false (default), the operation returns a 409 conflict if active subscriptions exist.
    query:
      name: query
      in: query
      description: Supply a query string to filter the results.
      required: false
      allowEmptyValue: true
      schema:
        type: string
        maximum: 1024
  responses:
    badRequest: # HTTP 400
      description: Bad Request. The data provided by the client did not match expectations.
    unauthorized: # HTTP 401
      description: Unauthorized. You may have provided no or wrong credentials.
    forbidden: # HTTP 403
      description: Forbidden. You are authenticated but do not have sufficient permissions to perform this action.
    notFound: # HTTP 404
      description: Not found. The resource has not been found.
    conflict: # HTTP 409
      description: Conflict. The resource has been modified by some other client. Please try again.
    unprocessable: # HTTP 422:
      description: Unprocessable Entity. The request cannot be executed.
    tooManyRequests: # HTTP 429
      description: Too Many Requests. You have exceeded the rate limits.
    internalServerError: # HTTP 500
      description: Internal server error. The application experienced some unexpected situation.

  schemas:
    topic:
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-sdk
      x-stackit-sdk:
        schema-name: topicResponse
      required:
        - id
        - displayName
        - state
        - createTime
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: An auto generated unique id which identifies the resource.
        displayName:
          type: string
          description: The display name is a short name chosen by the user to identify the resource.
          minLength: 1
          maxLength: 36
          pattern: '^[a-zA-Z0-9 -]*$'
        description:
          type: string
          description: The description is a longer text chosen by the user to provide more context for the resource.
          # NOTE: This maxLength is a protection against payloads which might not have an upper bound.
          maxLength: 1024
        settings:
          $ref: '#/components/schemas/topicSettings'
        labels:
          $ref: '#/components/schemas/labels'
        state:
          type: string
          description: The current state of the resource.
          enum:
            - reconciling
            - active
            - deleting
        createTime:
          type: string
          format: date-time
          maxLength: 128
          description: The point in time the resource was created.
        uri:
          type: string
          description: The URI for reaching the resource.
          # NOTE: This maxLength is a protection against payloads which might not have an upper bound.
          maxLength: 1024

    topicSettings:
      description: Configuration settings for the topic.
      type: object
      properties:
        retention:
          type: string
          description: |
            The maximum length of time a message is persisted in storage. 
            Messages older than this duration are automatically discarded/deleted.
            
            **Format:**
            Must be a scalar duration: a number (integer or decimal) followed by a unit ('s', 'm', or 'h').
            
            **Constraints:**
            - **Minimum:** "1s"
            - **Maximum:** "168h" (7 days)
          pattern: '^[0-9]+(\.[0-9]+)?(s|m|h)$'
          example: "24h"
          default: "168h"
        acl:
          type: array
          description: Whitelist of IPs in CIDR notation that can access the topic and its underlying subscriptions.
          items:
            type: string
            format: cidr
            example: "192.168.1.0/24"
          maxItems: 100
          default:
            - "0.0.0.0/0"
          example:
            - "192.168.1.0/24"
            - "192.168.2.0/24"
        metrics:
          type: boolean
          description: Enables or disables metrics collection for the topic.
          default: false
        serviceLogs:
          type: boolean
          description: Enables or disables sending of service logs for the topic.
          default: false

    labels:
      description: |
        Labels are key-value pairs used to group and organize subsets of resources.
        
        **Key constraints:**
        - May contain an optional domain prefix separated by a slash (`/`).
        - The domain prefix must be less than or equal to 250 characters and a valid DNS subdomain containing only lowercase alphanumerics (`[a-z0-9]`) and dashes (`-`), separated by dots (`.`).
        - The name part (excluding the domain prefix) must be between 1 and 63 characters long.
        - The name part must begin and end with an alphanumeric character (`[a-z0-9A-Z]`).
        - The name part may contain dashes (`-`), underscores (`_`), dots (`.`), and alphanumerics in between.
        - Keys starting with the prefix `stackit-` or having a domain prefix of `stackit.cloud` (including its subdomains, e.g., `*.stackit.cloud/`) are reserved for system use.
        
        **Value constraints:**
        - Must be less than or equal to 63 characters long (can be empty).
        - Must begin and end with an alphanumeric character (`[a-z0-9A-Z]`) if not empty.
        - May contain dashes (`-`), underscores (`_`), dots (`.`), and alphanumerics in between.
        
        **Count constraint:**
        - A maximum of 64 labels can be applied per resource. Restricted labels are excluded from this count.
      type: object
      maxProperties: 64
      additionalProperties:
        type: string
        nullable: true
        maxLength: 63
      example:
        environment: "production"
        project: "PubSub"
        empty-value-label: ""

    listTopicsResponse:
      required:
        - topics
      properties:
        topics:
          type: array
          maxLength: 100
          items:
            $ref: '#/components/schemas/topic'
        nextPageToken:
          type: string
          maxLength: 1024
          description: A token to retrieve the next page of results.

    createTopicRequest:
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-sdk
      x-stackit-sdk:
        schema-name: createTopicPayload
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: The display name is a short name chosen by the user to identify the resource.
          minLength: 1
          maxLength: 36
          pattern: '^[a-zA-Z0-9 -]*$'
        description:
          type: string
          description: The description is a longer text chosen by the user to provide more context for the resource.
          # NOTE: This maxLength is a protection against payloads which might not have an upper bound.
          maxLength: 1024
        settings:
          $ref: '#/components/schemas/topicSettings'
        labels:
          $ref: '#/components/schemas/labels'

    updateTopicRequest:
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-sdk
      x-stackit-sdk:
        schema-name: updateTopicPayload
      properties:
        displayName:
          type: string
          description: The display name is a short name chosen by the user to identify the resource.
          minLength: 1
          maxLength: 36
          pattern: '^[a-zA-Z0-9 -]*$'
        description:
          type: string
          description: The description is a longer text chosen by the user to provide more context for the resource.
          # NOTE: This maxLength is a protection against payloads which might not have an upper bound.
          maxLength: 1024
        settings:
          $ref: '#/components/schemas/topicSettings'
        labels:
          $ref: '#/components/schemas/labels'
    addEmailAddressRequest:
      x-stackit-sdk:
        schema-name: addEmailAddressPayload
      required:
        - emailAddress
      properties:
        emailAddress:
          type: string
          format: email
          description: A single RFC 5322 compliant email address.
          example: "jane.doe@example.com"
          maxLength: 254
    updateEmailAddressesRequest:
      x-stackit-sdk:
        schema-name: updateEmailAddressesPayload
      required:
        - emailAddresses
      properties:
        emailAddresses:
          type: array
          description: A list of valid subscriber email addresses.
          items:
            type: string
            format: email
            description: A single RFC 5322 compliant email address.
            example: "jane.doe@example.com"
    subscription:
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-sdk
      x-stackit-sdk:
        schema-name: subscriptionResponse
      required:
        - id
        - displayName
        - topicId
        - state
        - createTime
      properties:
        id:
          type: string
          format: uuid
          description: An auto generated unique id which identifies the resource.
        displayName:
          type: string
          description: The display name is a short name chosen by the user to identify the resource.
          minLength: 1
          maxLength: 36
          pattern: '^[a-zA-Z0-9 -]*$'
        topicId:
          type: string
          format: uuid
          description: The id of the topic to which the subscription belongs.
        description:
          type: string
          description: The description is a longer text chosen by the user to provide more context for the resource.
          # NOTE: This maxLength is a protection against payloads which might not have an upper bound.
          maxLength: 1024
        settings:
          $ref: '#/components/schemas/subscriptionSettings'
        labels:
          $ref: '#/components/schemas/labels'
        state:
          type: string
          description: The current state of the resource.
          enum:
            - reconciling
            - active
            - deleting
        createTime:
          type: string
          format: date-time
          description: The point in time the resource was created.

    subscriptionSettings:
      description: Configuration settings for the subscription.
      type: object
      properties:
        ackDeadline:
          type: string
          description: |
            The maximum amount of time the system waits for a message acknowledgment. 
            If a message is not acknowledged within this window, it will be redelivered.
            
            **Format:**
            Must be a duration string consisting of a number (integer or decimal) followed by a unit ('s', 'm', or 'h').
            
            **Constraints:**
            - **Minimum:** "1s"
            - **Maximum:** "168h" (7 days)
          pattern: '^[0-9]+(\.[0-9]+)?(s|m|h)$'
          example: "60s"
          default: "2m"

    listSubscriptionsResponse:
      required:
        - subscriptions
      properties:
        subscriptions:
          type: array
          maxLength: 100
          items:
