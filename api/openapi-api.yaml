      description: Grants an emailAddress access to pull from the given subscription.
      tags:
        - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/addEmailAddressRequest'
      responses:
        '202':
          description: Access to pull from the given subscription will be granted.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.subscription.subscriber.add
    put:
      operationId: update-subscription-subscriber-access
      description: Updates the access list of emailAddresses to pull from the given subscription.
      tags:
        - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateEmailAddressesRequest'
      responses:
        '202':
          description: Access to pull from the given Subscription will be granted.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.subscription.subscriber.update
    delete:
      operationId: revoke-subscription-subscriber-access
      description: Revokes all email-addresses access to pull from the given subscription.
      tags:
        - subscriptions
      responses:
        '202':
          description: Access to pull from the given subscription will be revoked.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
