# For details see https://spec.openapis.org/oas/v3.0.3.html
openapi: 3.0.3
info:
  version: 1beta.0.0
  title: 'STACKIT PubSub API'
  description: |
    This API provides endpoints for managing PubSubs.

# For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-api
x-stackit-api:
  type: stackit
# For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-scope
x-stackit-scope:
  visibility: public
  show-as-global: true
# For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-sdk
x-stackit-sdk:
  include: true
# For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-cors
x-stackit-cors:
  allow_origins_default:
    - portal
    - backoffice
# For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-portal
x-stackit-portal:
  cors: true
# For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-signer
x-stackit-signer:
  audience:
    - pubsub.stackit.cloud
x-stackit-ratelimit:
  rate: 1m
  limit: 200

servers:
  - url: https://api.pubsub.eu01.dev.stackit.cloud
    description: Development endpoint in eu01.
    # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-stage
    x-stackit-stage: dev-eu01
  - url: https://api.pubsub.eu01.qa.stackit.cloud
    description: QA endpoint in eu01.
    # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-stage
    x-stackit-stage: qa-eu01
  - url: https://api.pubsub.eu01.stackit.cloud
    description: Production endpoint in eu01.
    # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-stage
    x-stackit-stage: prd-eu01

tags:
  - name: topics
    description: Operations related to topics.
  - name: subscriptions
    description: Operations related to subscriptions.

paths:
  /v1beta/projects/{projectId}/regions/{regionId}/topics:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/regionId'
    get:
      operationId: list-topics
      description: Returns a list of all topics within the PubSub project.
      parameters:
        - $ref: '#/components/parameters/pageToken'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/query'
      tags:
        - topics
      responses:
        '200':
          description: Successful response with all topics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listTopicsResponse'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.topic.list
    post:
      operationId: create-topic
      description: Creates a new topic within the PubSub project.
      tags:
        - topics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createTopicRequest'
      responses:
        '202':
          description: New topic will be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/topic'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.topic.create
  /v1beta/projects/{projectId}/regions/{regionId}/topics/{topicId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/regionId'
      - $ref: '#/components/parameters/topicId'
    get:
      operationId: get-topic
      description: Returns the details for the given topic.
      tags:
        - topics
      responses:
        '200':
          description: Topic details successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/topic'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.topic.get
    delete:
      operationId: delete-topic
      description: Deletes the given topic.
      parameters:
        - $ref: '#/components/parameters/force'
      tags:
        - topics
      responses:
        '202':
          description: Topic will be deleted.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.topic.delete
    patch:
      operationId: update-topic
      description: Will update the given topic.
      tags:
        - topics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateTopicRequest'
      responses:
        '202':
          description: Topic will be updated.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.topic.update

  /v1beta/projects/{projectId}/regions/{regionId}/topics/{topicId}/publishers:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/regionId'
      - $ref: '#/components/parameters/topicId'
    get:
      operationId: list-topic-publishers
      description: Returns a list of emailAddresses that are allowed to publish to the given topic.
      tags:
        - topics
      responses:
        '200':
          description: Successful response with a list of all emailAddresses that are allowed to publish to the given topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listEmailAddressesResponse'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.topic.publisher.list
    patch:
      operationId: grant-topic-publisher-access
      description: Grants an emailAddress access to publish to the given topic.
      tags:
        - topics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/addEmailAddressRequest'
      responses:
        '202':
          description: Access to publish to the given topic will be granted.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.topic.publisher.add
    put:
      operationId: update-publisher-access
      description: Updates the access list of email-addresses to publish to the given topic.
      tags:
        - topics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateEmailAddressesRequest'
      responses:
        '202':
          description: Access to publish to the given topic will be granted.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.topic.publisher.update

    delete:
      operationId: revoke-topic-publisher-access
      description: Revokes all email-addresses access to publish to the given topic.
      tags:
        - topics
      responses:
        '202':
          description: Access to publish to the given topic will be revoked.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.topic.publisher.remove

  /v1beta/projects/{projectId}/regions/{regionId}/topics/{topicId}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/regionId'
      - $ref: '#/components/parameters/topicId'
    get:
      operationId: list-subscriptions
      description: Returns a list of all topic subscriptions.
      parameters:
        - $ref: '#/components/parameters/pageToken'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/query'
      tags:
        - subscriptions
      responses:
        '200':
          description: Successful response with all subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listSubscriptionsResponse'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.subscription.list
    post:
      operationId: create-subscription
      description: Creates a new subscription for a topic within the PubSub project.
      tags:
        - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createSubscriptionRequest'
      responses:
        '202':
          description: Subscription will be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.subscription.create

  /v1beta/projects/{projectId}/regions/{regionId}/topics/{topicId}/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/regionId'
      - $ref: '#/components/parameters/topicId'
      - $ref: '#/components/parameters/subscriptionId'
    get:
      operationId: get-subscription
      description: Returns the details for the given subscription.
      tags:
        - subscriptions
      responses:
        '200':
          description: Subscription details successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.subscription.get
    delete:
      operationId: delete-subscription
      description: Deletes the given subscription.
      parameters:
        - $ref: '#/components/parameters/force'
      tags:
        - subscriptions
      responses:
        '202':
          description: Subscription will be deleted.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.subscription.delete
    patch:
      operationId: update-subscription
      description: Will update the given subscription.
      tags:
        - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateSubscriptionRequest'
      responses:
        '202':
          description: Subscription will be updated.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessable'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
      # For details see https://developers.stackit.schwarz/domains/core-platform/api-management/api-gateway/features/annotations/#x-stackit-authorization
      x-stackit-authorization:
        resource-id-type: dynamic
        resource-id: projectId
        resource-type: project
        actions:
          - pubsub.subscription.update

  /v1beta/projects/{projectId}/regions/{regionId}/topics/{topicId}/subscriptions/{subscriptionId}/subscribers:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/regionId'
      - $ref: '#/components/parameters/topicId'
      - $ref: '#/components/parameters/subscriptionId'
    get:
      operationId: list-subscription-subscribers
      description: Returns a list of emailAddresses that are allowed to pull from the given subscription.
      tags:
        - subscriptions
      responses:
        '200':
          description: Successful response with a list of all emailAddresses that are allowed to pull from the given subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listEmailAddressesResponse'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
